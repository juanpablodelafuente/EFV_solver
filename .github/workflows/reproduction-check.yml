name: Reproduction check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest

      - name: Validate archived data
        env:
          MPLBACKEND: Agg
        run: python reproduce_all.py --check-only

      - name: Recreate figures and tables
        env:
          MPLBACKEND: Agg
        run: python reproduce_all.py --output-dir "$RUNNER_TEMP/reproduced"
